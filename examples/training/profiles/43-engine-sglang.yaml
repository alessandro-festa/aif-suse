# SGLang from the Inference Engines Apps, blueprint inference-sglang 1.0.0. Needs the
# "Inference Engines Apps" git custom repository (ClusterRepo aif-engines) in AI Factory Settings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: engine-sglang
  namespace: ai-profiles
  labels:
    trainingjobs/profile: inference
data:
  profile.yaml: |
    displayName: SGLang · Qwen2.5 1.5B
    description: SGLang's OpenAI-compatible server serving Qwen2.5-1.5B-Instruct on one GPU.
    framework: SGLang
    gpu: any
    status: beta
    blueprint: { name: inference-sglang, version: 1.0.0 }
