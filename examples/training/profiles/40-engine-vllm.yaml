# vLLM from the Application Collection (chart vllm 0.1.10), blueprint inference-vllm 1.0.0.
apiVersion: v1
kind: ConfigMap
metadata:
  name: engine-vllm
  namespace: ai-profiles
  labels:
    trainingjobs/profile: inference
data:
  profile.yaml: |
    displayName: vLLM · Qwen2.5 1.5B
    description: vLLM from the SUSE Application Collection, with its router, serving Qwen2.5-1.5B-Instruct on one GPU.
    framework: vLLM
    gpu: any
