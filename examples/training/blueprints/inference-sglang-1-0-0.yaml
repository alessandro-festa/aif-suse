# Inference engine: SGLang 1.0.0, the sglang chart (charts/inference-engines/sglang), Qwen2.5-1.5B on one GPU.
# Its inference profile is ../profiles/43-engine-sglang.yaml.
#
# Needs the "Inference Engines Apps" git custom repo (ClusterRepo aif-engines) in AI Factory Settings;
# it serves the inference-engines branch, published from charts/inference-engines.
{
  "apiVersion": "ai-factory.suse.com/v1alpha1",
  "kind": "Blueprint",
  "metadata": {
    "name": "inference-sglang-1-0-0",
    "labels": {
      "ai-factory.suse.com/blueprint-name": "inference-sglang",
      "ai-factory.suse.com/blueprint-version": "1.0.0",
      "ai-factory.suse.com/source": "custom"
    }
  },
  "spec": {
    "displayName": "SGLang",
    "version": "1.0.0",
    "source": "Custom",
    "description": "SGLang's OpenAI-compatible server on one NVIDIA GPU, serving\nQwen2.5-1.5B-Instruct from Hugging Face.\n\nNEEDS the sglang chart from the \"Inference Engines Apps\" git custom repository\n(ClusterRepo aif-engines) in AI Factory Settings.",
    "components": [
      {
        "chartName": "sglang",
        "chartRepo": "aif-engines",
        "chartVersion": "0.1.0",
        "values": {
          "model": {
            "id": "Qwen/Qwen2.5-1.5B-Instruct",
            "contextLength": 8192
          },
          "gpu": {
            "count": 1
          },
          "resources": {
            "requests": {
              "cpu": "2",
              "memory": "8Gi"
            },
            "limits": {
              "cpu": "4",
              "memory": "16Gi"
            }
          }
        }
      }
    ]
  }
}
