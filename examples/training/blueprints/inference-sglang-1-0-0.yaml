# Inference engine: SGLang 1.0.0, the generic inference-engine chart (charts/inference-engine)
# with engine=sglang, Qwen2.5-1.5B on one GPU. Its inference profile is
# ../profiles/43-engine-sglang.yaml.
#
# Needs the chart in a ClusterRepo named aif-engines (a git custom repo in AI Factory Settings).
{
  "apiVersion": "ai-factory.suse.com/v1alpha1",
  "kind": "Blueprint",
  "metadata": {
    "name": "inference-sglang-1-0-0",
    "labels": {
      "ai-factory.suse.com/blueprint-name": "inference-sglang",
      "ai-factory.suse.com/blueprint-version": "1.0.0",
      "ai-factory.suse.com/source": "custom"
    }
  },
  "spec": {
    "displayName": "SGLang",
    "version": "1.0.0",
    "source": "Custom",
    "description": "SGLang's OpenAI-compatible server on one NVIDIA GPU, serving\nQwen2.5-1.5B-Instruct from Hugging Face.\n\nNEEDS the inference-engine chart in a ClusterRepo named aif-engines: add it in\nAI Factory Settings as a git custom repository pointing at the repository that\nholds charts/inference-engine.",
    "components": [
      {
        "chartName": "inference-engine",
        "chartRepo": "aif-engines",
        "chartVersion": "0.1.0",
        "values": {
          "engine": "sglang",
          "model": {
            "id": "Qwen/Qwen2.5-1.5B-Instruct",
            "contextLength": 8192
          },
          "hfTokenSecret": "",
          "gpu": {
            "count": 1
          },
          "resources": {
            "requests": {
              "cpu": "2",
              "memory": "8Gi"
            },
            "limits": {
              "cpu": "4",
              "memory": "16Gi"
            }
          }
        }
      }
    ]
  }
}
