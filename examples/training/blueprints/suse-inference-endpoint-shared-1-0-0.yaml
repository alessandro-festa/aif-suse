# SUSE Inference Endpoint (shared GPU) 1.0.0: the vLLM engine on a 5 GiB KAI GPU-memory share.
#
# The engine pod carries KAI's gpu-memory annotation (5120 MiB), schedulerName kai-scheduler and a
# kai.scheduler/queue label, and requests no whole GPU and no DRA claim. KAI queues it until a GPU
# has 5 GiB free; HAMi-core caps it there. Set the queue label to the target project's queue.
# vLLM's --gpu-memory-utilization is a fraction of the share it sees, sized to leave room for the
# KV cache of about eight full-length requests.
#
# Components: vllm 0.1.10 from the SUSE Application Collection (the application-collection
# ClusterRepo), as the SUSE blueprints use, and litellm 1.81.13 from the SUSE Registry. Earlier,
# this blueprint was suse-inference-endpoint-dra 1.3.0, on the vllm-dra fork.
{
  "apiVersion": "ai-factory.suse.com/v1alpha1",
  "kind": "Blueprint",
  "metadata": {
    "name": "suse-inference-endpoint-shared-1-0-0",
    "labels": {
      "ai-factory.suse.com/blueprint-name": "suse-inference-endpoint-shared",
      "ai-factory.suse.com/blueprint-version": "1.0.0",
      "ai-factory.suse.com/source": "custom"
    }
  },
  "spec": {
    "displayName": "SUSE Inference Endpoint (shared GPU)",
    "version": "1.0.0",
    "source": "Custom",
    "description": "OpenAI-compatible LLM gateway (LiteLLM: virtual keys, teams, budgets,\nrate limits, prompt-injection guardrails) in front of vLLM on 5 GiB of a\nshared GPU. Based on SUSE Inference Endpoint 1.0.1.\n\nPREREQUISITE: Secret \"litellm-credentials\" in the target namespace with\nPROXY_MASTER_KEY, LITELLM_SALT_KEY and UI_USERNAME (see the SUSE Inference\nEndpoint blueprint). Public models need no Hugging Face token.\n\nThe GPU is shared through KAI Scheduler: the engine asks for 5 GiB of a GPU (gpu-memory\nannotation) in the project's KAI queue, waits there while no GPU has 5 GiB free, and is capped by\nKAI's GPU sharing (HAMi-core or NvFractions). Needs KAI with GPU sharing and the device plugin\non the GPU node. It runs the SUSE Application Collection vllm chart, as the SUSE blueprints do.",
    "components": [
      {
        "chartName": "vllm",
        "chartRepo": "application-collection",
        "chartVersion": "0.1.10",
        "vendor": "suse",
        "values": {
          "global": {
            "imagePullSecrets": [
              "application-collection"
            ],
            "imageRegistry": ""
          },
          "routerSpec": {
            "enableRouter": true,
            "registry": "dp.apps.rancher.io",
            "repository": "containers/lmcache-lmstack-router",
            "tag": "0.1.10-3.60",
            "imagePullPolicy": "IfNotPresent",
            "replicaCount": 1,
            "containerPort": 8000,
            "servicePort": 80,
            "serviceType": "ClusterIP",
            "serviceDiscovery": "k8s",
            "k8sServiceDiscoveryType": "pod-ip",
            "routingLogic": "roundrobin",
            "ingress": {
              "enabled": false
            },
            "autoscaling": {
              "enabled": false,
              "minReplicas": 1,
              "maxReplicas": 3,
              "targetCPUUtilizationPercentage": 80
            },
            "resources": {
              "requests": {
                "cpu": "400m",
                "memory": "1000Mi"
              },
              "limits": {
                "memory": "1000Mi"
              }
            }
          },
          "servingEngineSpec": {
            "enableEngine": true,
            "containerPort": 8000,
            "servicePort": 80,
            "runtimeClassName": "",
            "modelSpec": [
              {
                "name": "qwen2-5-1-5b",
                "modelURL": "Qwen/Qwen2.5-1.5B-Instruct",
                "registry": "dp.apps.rancher.io",
                "repository": "containers/vllm-openai",
                "tag": "0.19.0-5.29",
                "imagePullPolicy": "IfNotPresent",
                "replicaCount": 1,
                "requestCPU": 2,
                "requestMemory": "5Gi",
                "requestGPU": 0,
                "pvcStorage": "20Gi",
                "pvcAccessMode": [
                  "ReadWriteOnce"
                ],
                "storageClass": "longhorn",
                "env": [
                  {
                    "name": "HF_TOKEN",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "huggingface-token",
                        "key": "HF_TOKEN",
                        "optional": true
                      }
                    }
                  }
                ],
                "vllmConfig": {
                  "dtype": "half",
                  "maxModelLen": 4096,
                  "extraArgs": [
                    "--gpu-memory-utilization",
                    "0.85",
                    "--max-num-seqs",
                    "16"
                  ]
                },
                "podAnnotations": {
                  "gpu-memory": "5120"
                }
              }
            ],
            "strategy": {
              "type": "Recreate"
            },
            "schedulerName": "kai-scheduler",
            "labels": {
              "kai.scheduler/queue": "aif-submit"
            }
          }
        }
      },
      {
        "chartName": "litellm",
        "chartRepo": "suse-ai-registry",
        "chartVersion": "1.81.13",
        "values": {
          "autoscaling": {
            "enabled": false,
            "maxReplicas": 5,
            "minReplicas": 1,
            "targetCPUUtilizationPercentage": 80
          },
          "db": {
            "database": "litellm",
            "deployStandalone": true,
            "useExisting": false
          },
          "environmentSecrets": [
            "litellm-credentials"
          ],
          "global": {
            "imagePullSecrets": [
              "application-collection"
            ],
            "imageRegistry": ""
          },
          "image": {
            "pullPolicy": "IfNotPresent",
            "registry": "registry.suse.com",
            "repository": "ai/containers/litellm-database",
            "tag": "v1.81.13"
          },
          "ingress": {
            "className": "nginx",
            "enabled": false,
            "hosts": [
              {
                "host": "inference.example.com",
                "paths": [
                  {
                    "path": "/",
                    "pathType": "Prefix"
                  }
                ]
              }
            ],
            "tls": []
          },
          "masterkeySecretKey": "PROXY_MASTER_KEY",
          "masterkeySecretName": "litellm-credentials",
          "migrationJob": {
            "enabled": true
          },
          "postgresql": {
            "architecture": "standalone",
            "auth": {
              "database": "litellm",
              "password": "ChangeMe-litellm-db-password",
              "postgres-password": "ChangeMe-litellm-db-password",
              "username": "litellm"
            },
            "persistence": {
              "storageClass": "longhorn"
            },
            "podTemplates": {
              "initContainers": {
                "volume-permissions": {
                  "enabled": true
                }
              }
            }
          },
          "proxyConfigMap": {
            "create": true
          },
          "proxy_config": {
            "general_settings": {
              "master_key": "os.environ/PROXY_MASTER_KEY",
              "store_model_in_db": true,
              "store_prompts_in_spend_logs": false
            },
            "guardrails": [],
            "litellm_settings": {
              "callbacks": [
                "detect_prompt_injection"
              ],
              "drop_params": true,
              "prompt_injection_params": {
                "heuristics_check": true,
                "reject_as_response": true,
                "similarity_check": true
              }
            },
            "model_list": [
              {
                "litellm_params": {
                  "api_base": "http://vllm-router-service:80/v1",
                  "api_key": "dummy-vllm-has-no-auth",
                  "model": "openai/Qwen/Qwen2.5-1.5B-Instruct"
                },
                "model_info": {
                  "access_groups": [
                    "general"
                  ]
                },
                "model_name": "qwen2.5-1.5b"
              }
            ]
          },
          "replicaCount": 1,
          "resources": {},
          "service": {
            "port": 4000,
            "type": "ClusterIP"
          },
          "serviceMonitor": {
            "enabled": false,
            "interval": "15s"
          }
        },
        "vendor": "suse"
      }
    ]
  }
}
