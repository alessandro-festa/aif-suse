# Blueprint C2 — Inference engine for OpenShell, SHARED (CPU / Ollama).
#
# One of two inference blueprints. Pick ONE per tenant:
#
#   C1   40-...-ollama-tenant.yaml   engine INSIDE the tenant namespace
#   C2 (this file)  41-...-ollama-shared.yaml   ONE engine in "openshell"
#
# They deploy the same chart and the same model; they differ in blast radius,
# footprint and defaults. Nothing stops a cluster running both — tenants that
# need isolation get C1, the rest point at C2. The choice is expressed when the
# admin sets the tenant's provider URL, so it can be changed later without
# touching sandboxes: inference routing hot-reloads in ~5s.
#
# CHOOSE C2 (this one) FOR EFFICIENCY. Install it ONCE. Every tenant's provider
# points at the same URL, so the model is pulled once and held in memory once
# instead of once per namespace. On a laptop cluster with more than one tenant
# this is the only variant that fits.
#
# WHAT YOU GIVE UP. Tenants share one process, so they share its queue: a long
# generation for tenant-a adds latency for tenant-b, and one tenant can starve
# the others. The engine also outlives any single tenant namespace. There is no
# per-tenant accounting. Prompts are not co-mingled — each request is
# independent — but they do all traverse one pod, so it is one more place where
# an operator with pod access could observe traffic from every tenant. If that
# matters for a tenant, give that tenant C1.
#
# CROSS-NAMESPACE REACHABILITY IS FINE. The sandbox pod's supervisor makes the
# upstream call and there is no egress NetworkPolicy on sandbox pods: the
# workspace chart's policy is Ingress-only, selecting
# `openshell.ai/managed-by: openshell` on port 2222. Sandbox policy needs no
# rule either — inference.local is a built-in supervisor route and is never
# evaluated against network_policies.
#
# GPU CLUSTERS: do not use either. Install the shipped "suse-inference-endpoint"
# blueprint instead (vLLM + LiteLLM), then wire OpenShell at LiteLLM. Both
# wiring recipes are in docs/openshell-blueprints.md.
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: openshell-inference-ollama-shared
    ai-factory.suse.com/blueprint-version: 0.2.1
  name: openshell-inference-ollama-shared-0-2-1
spec:
  source: SUSE
  displayName: OpenShell Inference (Ollama, shared)
  version: 0.2.1
  description: |
    A CPU-friendly OpenAI-compatible inference endpoint for NVIDIA OpenShell
    sandboxes, using Ollama from the SUSE Application Collection. This is the
    SHARED variant: one engine in the "openshell" namespace, used by every
    tenant.

    For a dedicated engine inside a tenant's own namespace, install "OpenShell
    Inference (Ollama, per-tenant)" instead. Same chart, same model, one copy
    per tenant.

    INSTALL ONCE. The namespace is pinned to "openshell", so the in-cluster URL
    is fixed and every tenant uses the same one:
      http://ollama.openshell.svc.cluster.local:11434/v1

    AFTER INSTALL — wire it into OpenShell. These are gateway runtime state, not
    Helm values, so they run through the CLI once the pod is Ready.

    BOTH COMMANDS ARE WORKSPACE-SCOPED. Omitting --workspace targets the
    "default" workspace, and sandboxes in a tenant workspace then see no
    provider and no inference route. Repeat per tenant — same URL each time.

      openshell -g <gateway> --workspace <tenant> provider create \
        --name ollama-shared \
        --type openai \
        --credential OPENAI_API_KEY=ollama \
        --config OPENAI_BASE_URL=http://ollama.openshell.svc.cluster.local:11434/v1

      openshell -g <gateway> --workspace <tenant> inference set \
        --provider ollama-shared \
        --model qwen3:1.7b \
        --no-verify

      openshell -g <gateway> --workspace <tenant> inference get

    Ollama ignores the API key, but `provider create --type openai` requires one
    to be present — hence the placeholder value above. Note that credential keys
    are environment variable NAMES, not field names.

    Inference routing hot-reloads in a few seconds; there is no need to recreate
    sandboxes after changing it. That is what makes the C1/C2 choice reversible:
    re-run `provider create` + `inference set` with the other URL and the
    tenant's running sandboxes follow. Inside a sandbox the endpoint is
    https://inference.local — with a /v1 suffix for OpenAI-style clients, and
    WITHOUT one for Claude Code (ANTHROPIC_BASE_URL).

    Sandbox policy needs NO rule for inference.local: it is a built-in
    supervisor route and is never evaluated against network policy. That holds
    across namespaces, so nothing extra is needed to reach this shared engine.

    --no-verify is there because `inference set` probes the endpoint before
    saving, and Ollama does not answer until it has finished pulling the model.
    Drop the flag once the pod has been up for a few minutes.

    MODEL CHOICE — qwen3:1.7b (~1.4 GB, Apache-2.0) is the default because it
    is the smallest model measured here that sustains a real TOOL-CALLING
    LOOP. A model that only chats proves the inference.local path but cannot
    drive an agent, and an agent that cannot call tools is not a demo.

    Measured on CPU with an agent-style system prompt and one `run_command`
    tool, through the OpenAI-compatible /v1 endpoint using DEFAULT request
    parameters — which is what an agent harness actually sends:

      qwen3:1.7b          1.4 GB   5/9   9.2s
      qwen3.5:0.8b        1.0 GB   5/9  14.1s
      qwen2.5:7b-instruct 4.7 GB   8/9   5.2s
      granite3.1-moe:1b   1.4 GB   0/12 — DO NOT USE

    READ THAT TABLE CAREFULLY, because it is not the ranking you would expect.
    qwen2.5:7b-instruct is both FASTER and MORE RELIABLE than the smaller
    models. qwen3 and qwen3.5 are hybrid reasoning models and Ollama leaves
    thinking ON, so they spend their extra latency on reasoning tokens and
    still miss tool calls.

    ON THIS SHARED VARIANT, SERIOUSLY CONSIDER qwen2.5:7b-instruct. The 1.7b
    default is inherited from the per-tenant variant, where footprint is
    multiplied by the tenant count. Here the model is paid for ONCE, so the
    4.7 GB is cheap and the better numbers are yours for the taking — and
    latency matters more here than anywhere, because turns QUEUE across
    tenants. To switch: set models.pull/run to qwen2.5:7b-instruct, raise
    resources to requests 6Gi / limits 8Gi, and pass the tag to
    `inference set --model`.

    Thinking can be suppressed per-request with `reasoning_effort: "none"`
    (measured 17.4s -> 3.0s, and it fixes the tool call), but that is a CLIENT
    parameter. There is no way to disable it server-side from this chart:
    Ollama has no Modelfile `think` parameter, and neither `/no_think` in the
    system prompt nor `chat_template_kwargs` is honoured.

    granite3.1-moe:1b is called out because it looks like a candidate and is
    not: it emits its tool call as literal <tool_call> text in the message
    body instead of a structured tool_calls array, so any OpenAI-shaped client
    sees a model that never calls tools.

    USE A SYSTEM PROMPT. Every number above depends on it. The same 1.7b model
    scores near zero on a bare prompt with no system message. Small models do
    not volunteer tool use; OpenClaw sends such a prompt, a hand-rolled curl
    test does not.

    All four models above are Apache-2.0.
    https://huggingface.co/Qwen/Qwen3-1.7B

    SERVING SEVERAL MODELS. models.pull below is a list: add a second tag and
    different tenants can point `inference set --model` at different models
    against this same engine. Ollama loads them on demand, so budget RAM for
    the ones actually in concurrent use, and raise resources.limits.memory to
    match.
  components:
    - chartRepo: application-collection
      chartName: ollama
      chartVersion: 1.55.0
      vendor: suse
      # Pinned, NOT taken from the install wizard. A shared engine has exactly
      # one correct location, and pinning it keeps the URL quoted above — and in
      # every tenant's provider config — always correct.
      targetNamespace: openshell
      values:
        # Pin the service name so the URL does not depend on the Helm release
        # name (which the operator derives from the chart name).
        fullnameOverride: ollama

        image:
          registry: dp.apps.rancher.io
          repository: containers/ollama
          tag: 0.21.2-11.48
          pullPolicy: IfNotPresent

        ollama:
          port: 11434
          models:
            # Pulled at startup, then kept resident. ~1.4 GB on disk, ~2-3 GB
            # of RAM to serve — paid ONCE for the whole cluster. Keep this in
            # step with resources below and with `inference set --model`.
            pull:
              - qwen3:1.7b
            run:
              - qwen3:1.7b
          gpu:
            enabled: false

        service:
          type: ClusterIP
          port: 11434

        # ON by default here, unlike the per-tenant variant. There is only one
        # copy, so the storage cost is paid once, and a shared engine is
        # long-lived infrastructure that should not re-pull its model on every
        # restart while every tenant waits.
        #
        # The cluster needs a default StorageClass, or set storageClass
        # explicitly — otherwise the PVC stays Pending and the pod never starts.
        # Set enabled: false if you have no StorageClass.
        persistentVolume:
          enabled: true
          # Room for qwen3:1.7b (~1.4 GB) plus several more, since this engine
          # is expected to serve several tenants' model choices — and enough
          # slack to step up to a 7 B model without resizing. PVCs grow but
          # never shrink.
          size: 20Gi
          storageClass: ""

        # Set here, unlike the per-tenant variant: this pod is a shared
        # dependency, so it should have a guaranteed floor and a ceiling that
        # stops one tenant's load evicting anything else. CPU inference is
        # memory-bound. Raise memory before CPU if generation is slow.
        #
        # SIZED FOR qwen3:1.7b, which needs roughly 2-3 GB resident. THESE MOVE
        # WITH THE MODEL: a limit below what the model needs is not "slow", it
        # is an OOMKill loop the moment the first prompt arrives. Stepping up to
        # qwen2.5:7b-instruct means roughly 6 GB resident, so requests 6Gi /
        # limits 8Gi. On a laptop, check the Docker/VM memory ceiling too —
        # kind cannot hand out RAM its host VM does not have.
        resources:
          requests:
            cpu: 1000m
            memory: 3Gi
          limits:
            memory: 5Gi

        ingress:
          # Never expose the raw engine. Sandboxes reach it through OpenShell's
          # inference router at https://inference.local, which strips sandbox
          # credentials, injects the real provider credential and rewrites the
          # model name. The proxying is done by the sandbox pod's own supervisor
          # using a route bundle it fetches from the gateway, so a ClusterIP
          # Service is all that is needed — including from other namespaces.
          enabled: false
