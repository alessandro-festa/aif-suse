# Gateway-wide baseline policy — a floor no individual sandbox can lower.
#
#   openshell policy set --global --policy global-baseline.yaml
#   openshell policy delete --global        # to lift it again
#
# READ THIS FIRST. A global policy is applied IN FULL to every sandbox on the
# gateway, and while one is set the gateway REJECTS every sandbox-level policy
# update. That is the point — but it also means `openshell policy set <sandbox>`
# stops working until you delete the global policy. Do not set this and then
# wonder why examples/openshell/policies/tenant-suse-ai.yaml will not apply.
#
# Because it replaces rather than merges, this file must contain everything
# every sandbox on the gateway needs. What is below is deliberately austere:
# no package installs, no source control, no external inference. Add to it
# before using it for real.
#
# `credential_binding` is rejected in a global policy — it is valid only in a
# sandbox-scoped one.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  # The strict choice: abort sandbox startup rather than run with reduced
  # filesystem isolation if any listed path cannot be opened. Switch to
  # best_effort if you run heterogeneous images and the aborts are noise.
  compatibility: hard_requirement

process:
  # Never root. OpenShell rejects UID 0 outright.
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # The only egress this baseline grants. Everything else — PyPI, npm, GitHub,
  # external inference APIs — is denied until it is added here explicitly.
  #
  # Note that inference.local is NOT listed and does not need to be: it is a
  # built-in supervisor route and is not evaluated against network policy. A
  # sandbox on this baseline can still reach the configured model.
  suse_registry:
    name: suse-registry
    endpoints:
      - host: registry.suse.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/zypper }

network_middlewares:
  # Redaction applied to every sandbox, regardless of what its own policy says.
  # This is the main argument for having a global policy at all.
  redact-api-tokens:
    name: Redact API tokens
    middleware: openshell/regex
    order: 10
    config:
      mode: redact
    on_error: fail_closed
    endpoints:
      include:
        - "registry.suse.com"
