# Blueprint C1 — Inference engine for OpenShell, PER-TENANT (CPU / Ollama).
#
# One of two inference blueprints. Pick ONE per tenant:
#
#   C1 (this file)  40-...-ollama-tenant.yaml   engine INSIDE the tenant namespace
#   C2              41-...-ollama-shared.yaml   ONE engine in "openshell", shared
#
# They deploy the same chart and the same model; they differ in blast radius,
# footprint and defaults. Nothing stops a cluster running both — tenants that
# need isolation get C1, the rest point at C2. The choice is expressed when the
# admin sets the tenant's provider URL, so it can be changed later without
# touching sandboxes: inference routing hot-reloads in ~5s.
#
# CHOOSE C1 (this one) FOR MAXIMUM ISOLATION. The engine lives in the tenant's
# own namespace, next to its sandboxes. Nothing about the tenant's prompts,
# model or load is visible to or contended with any other tenant, and deleting
# the tenant namespace removes the engine with it.
#
# WHY THAT IS THE ISOLATED SHAPE. The sandbox pod's own supervisor makes the
# upstream call, not the gateway: openshell-supervisor-network fetches the route
# bundle from the gateway over gRPC every ~5s and then proxies the request
# itself. So the engine is reached FROM the tenant namespace, and putting it
# there keeps the hop intra-namespace. It also matches OpenShell's own grain —
# providers and inference routes are workspace-scoped, not gateway-scoped.
#
# THE COST, stated plainly: one model copy per tenant. qwen3:1.7b is ~1.4 GB
# pulled and held resident, per namespace, and needs roughly 2-3 GB of RAM to
# serve. That is small enough that a handful of per-tenant engines fit on a
# laptop cluster — which is what makes this variant practical rather than
# theoretical. Past three or four tenants, prefer C2 anyway.
#
# WHY A SEPARATE BLUEPRINT rather than a second component of Blueprint B: so a
# tenant can opt out of inference, or choose C2 instead, and so a cluster that
# already has an engine is not forced to deploy another. The operator fans
# components out in a single pass with no ordering or wait-for-ready, so merging
# the two would work — it would just remove the choice.
#
# GPU CLUSTERS: do not use either. Install the shipped "suse-inference-endpoint"
# blueprint instead (vLLM + LiteLLM), then wire OpenShell at LiteLLM. Both
# wiring recipes are in docs/openshell-blueprints.md.
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  labels:
    ai-factory.suse.com/blueprint-name: openshell-inference-ollama-tenant
    ai-factory.suse.com/blueprint-version: 0.2.1
  name: openshell-inference-ollama-tenant-0-2-1
spec:
  source: SUSE
  displayName: OpenShell Inference (Ollama, per-tenant)
  version: 0.2.1
  description: |
    A CPU-friendly OpenAI-compatible inference endpoint for NVIDIA OpenShell
    sandboxes, using Ollama from the SUSE Application Collection. This is the
    ISOLATED variant: one engine per tenant, inside the tenant's own namespace.

    For a single engine shared by every tenant, install "OpenShell Inference
    (Ollama, shared)" instead. Same chart, same model, one copy.

    Install once per tenant, choosing that tenant's namespace in the install
    wizard — the same namespace you gave the "OpenShell Workspace" blueprint.
    The service name is pinned, so the in-cluster URL is deterministic:
      http://ollama.<tenant>.svc.cluster.local:11434/v1

    Give each install a globally unique AIWorkload name (e.g.
    openshell-inf-<tenant>). The Fleet HelmOp is "<aiworkload-name>-ollama" and
    the AIWorkload's namespace is not part of it, so two tenants using the same
    instance name collide on one HelmOp.

    AFTER INSTALL — wire it into OpenShell. These are gateway runtime state, not
    Helm values, so they run through the CLI once the pod is Ready.

    BOTH COMMANDS ARE WORKSPACE-SCOPED. Omitting --workspace targets the
    "default" workspace, and sandboxes in a tenant workspace then see no
    provider and no inference route. Repeat per tenant, with that tenant's URL.

      openshell -g <gateway> --workspace <tenant> provider create \
        --name ollama-local \
        --type openai \
        --credential OPENAI_API_KEY=ollama \
        --config OPENAI_BASE_URL=http://ollama.<tenant>.svc.cluster.local:11434/v1

      openshell -g <gateway> --workspace <tenant> inference set \
        --provider ollama-local \
        --model qwen3:1.7b \
        --no-verify

      openshell -g <gateway> --workspace <tenant> inference get

    Ollama ignores the API key, but `provider create --type openai` requires one
    to be present — hence the placeholder value above. Note that credential keys
    are environment variable NAMES, not field names.

    Inference routing hot-reloads in a few seconds; there is no need to recreate
    sandboxes after changing it. Inside a sandbox the endpoint is
    https://inference.local — with a /v1 suffix for OpenAI-style clients, and
    WITHOUT one for Claude Code (ANTHROPIC_BASE_URL).

    Sandbox policy needs NO rule for inference.local: it is a built-in
    supervisor route and is never evaluated against network policy.

    --no-verify is there because `inference set` probes the endpoint before
    saving, and Ollama does not answer until it has finished pulling the model.
    Drop the flag once the pod has been up for a few minutes.

    MODEL CHOICE — qwen3:1.7b (~1.4 GB, Apache-2.0) is the default because it
    is the smallest model measured here that sustains a real TOOL-CALLING LOOP.
    That is the bar: a model that only chats proves the inference.local path
    but cannot drive an agent, and an agent that cannot call tools is not a
    demo.

    Measured on CPU with an agent-style system prompt and one `run_command`
    tool, through the OpenAI-compatible /v1 endpoint using DEFAULT request
    parameters — which is what an agent harness actually sends:

      qwen3:1.7b          1.4 GB   5/9   9.2s
      qwen3.5:0.8b        1.0 GB   5/9  14.1s
      qwen2.5:7b-instruct 4.7 GB   8/9   5.2s
      granite3.1-moe:1b   1.4 GB   0/12 — DO NOT USE

    READ THAT TABLE CAREFULLY, because it is not the ranking you would expect.
    qwen2.5:7b-instruct is both FASTER and MORE RELIABLE than the smaller
    models here. qwen3 and qwen3.5 are hybrid reasoning models and Ollama
    leaves thinking ON, so they spend their extra latency on reasoning tokens
    and still miss tool calls. The only reason qwen3:1.7b is the default is
    FOOTPRINT: 1.4 GB and ~2-3 GB of RAM per tenant versus 4.7 GB and ~6 GB.
    For a per-tenant engine that difference is what makes the variant usable
    at all. If you have the RAM, qwen2.5:7b-instruct is the better model —
    raise the PVC to 15Gi when you switch.

    Thinking can be suppressed per-request with `reasoning_effort: "none"`
    (measured 17.4s -> 3.0s, and it fixes the tool call), but that is a CLIENT
    parameter. There is no way to disable it server-side from this chart:
    Ollama has no Modelfile `think` parameter, and neither `/no_think` in the
    system prompt nor `chat_template_kwargs` is honoured. So unless the agent
    you are demoing sends reasoning_effort, assume the slower numbers above.

    granite3.1-moe:1b is called out because it looks like a candidate and is
    not: it emits its tool call as literal <tool_call> text in the message
    body instead of a structured tool_calls array, so any OpenAI-shaped client
    sees a model that never calls tools. Capability tags are not a substitute
    for trying it.

    USE A SYSTEM PROMPT. Every number above depends on it. The same 1.7b model
    scores near zero on a bare prompt with no system message. Small models do
    not volunteer tool use; agent harnesses like OpenClaw send such a prompt,
    hand-rolled curl tests do not, which is a good way to wrongly conclude the
    model is broken.

    All four models above are Apache-2.0. Whatever you choose, pass the same
    tag to `inference set --model`.
    https://huggingface.co/Qwen/Qwen3-1.7B
  components:
    - chartRepo: application-collection
      chartName: ollama
      chartVersion: 1.55.0
      vendor: suse
      # Deliberately no targetNamespace: this component follows the AIWorkload's
      # targetNamespace, i.e. the tenant namespace picked in the install wizard.
      # fullnameOverride below pins the service NAME, so the URL is still
      # deterministic — it is just tenant-scoped:
      #   http://ollama.<tenant>.svc.cluster.local:11434/v1
      values:
        # Pin the service name so the URL does not depend on the Helm release
        # name (which the operator derives from the chart name).
        fullnameOverride: ollama

        image:
          registry: dp.apps.rancher.io
          repository: containers/ollama
          tag: 0.21.2-11.48
          pullPolicy: IfNotPresent

        ollama:
          port: 11434
          models:
            # Pulled at startup, then kept resident. ~1.4 GB on disk and about
            # 2-3 GB of RAM to serve — one copy PER TENANT NAMESPACE. Small
            # enough that several per-tenant engines coexist on a laptop; see
            # MODEL CHOICE in the description before swapping the tag, and keep
            # `inference set --model` in step with it.
            pull:
              - qwen3:1.7b
            run:
              - qwen3:1.7b
          gpu:
            enabled: false

        service:
          type: ClusterIP
          port: 11434

        # ON by default since 0.2.1, so the model survives a pod restart
        # instead of being re-pulled while the tenant waits. THE CLUSTER
        # THEREFORE NEEDS A DEFAULT StorageClass (kind and RKE2 both ship one),
        # or set storageClass explicitly below — otherwise the PVC stays
        # Pending and the pod never starts. With a 1.4 GB model the re-pull is
        # survivable, so set enabled: false if you have no StorageClass.
        persistentVolume:
          enabled: true
          # qwen3:1.7b is ~1.4 GB; the rest is headroom for a second model and
          # for Ollama's blob layout. PVCs can be grown but not shrunk, so this
          # is deliberately not sized to the byte.
          size: 8Gi
          storageClass: ""

        # CPU inference is memory-bound, not CPU-bound. Left unset so the pod
        # schedules on a small cluster; set requests/limits on a shared one.
        resources: {}

        ingress:
          # Never expose the raw engine. Sandboxes reach it through OpenShell's
          # inference router at https://inference.local, which strips sandbox
          # credentials, injects the real provider credential and rewrites the
          # model name. The proxying is done by the sandbox pod's own supervisor
          # using a route bundle it fetches from the gateway, so a ClusterIP
          # Service reachable from the tenant namespace is all that is needed.
          enabled: false
