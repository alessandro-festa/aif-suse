# SUSE Security (NeuVector) — MANAGED cluster, the remote member.
#
# Target: kind-downstream-1 (Rancher cluster ID c-jhrj6, 3 arm64 nodes).
# Chart:  neuvector 110.0.1+up2.11.1 from rancher-charts (core 2.11.1).
#
# This is the install the agents actually talk to. It joins the master on
# sims-datacenter — see primary-sims-datacenter.values.yaml for the why.
#
# THE ONE LINE THAT MATTERS MOST IS `controller.apisvc.type`.
#
# ../../../secops-agent-factory/policies/remediation-sandbox.yaml declares its
# `suse_security` egress group against a controller REST API on port 10443.
# The chart does NOT create that endpoint by default: `apisvc.type` is empty
# in upstream values, and an empty type means the
# `neuvector-svc-controller-api` Service template is skipped entirely. Without
# it the only controller Service is the headless `neuvector-svc-controller` on
# 18300/18301 — cluster-internal gossip, not the REST API. Setting the type
# below creates the Service, in this cluster, at a name the sandboxes can
# resolve through ordinary in-cluster DNS.
#
# CORRECTION TO THE GPU PROFILE, worth reading before copying its policy.
# That file names the host as:
#
#     host: neuvector-svc-controller.cattle-neuvector-system   # <- 18300/18301
#
# but the Service the chart actually creates on 10443 is named
#
#     neuvector-svc-controller-api.cattle-neuvector-system
#
# The GPU policy was written against a cluster that had no NeuVector on it, so
# nothing ever caught this: as written, its `suse_security` group points at a
# headless Service that does not listen on the port it names. The five CPU
# policies in ../../policies/ must use the `-api` name. It is a one-token fix,
# not a redesign — but it is a fix, and the GPU file should get it too.
#
# What federation buys is still the important part: the agents reach SUSE
# Security by an in-cluster DNS name on their OWN cluster, so no policy has to
# carry a cross-cluster node IP and NodePort that changes with the environment.

# bootstrapPassword is deliberately unset — see the long note in
# primary-sims-datacenter.values.yaml. Note that the two clusters generate
# DIFFERENT random passwords, so the primary's will not work here.

global:
  # Same reasoning as the primary: these are Rancher's own values, and
  # `cattle.url` must equal the Rancher server-url or SSO redirects break.
  # Read live with:
  #   kubectl get settings.management.cattle.io server-url -o jsonpath='{.value}'
  # clusterId is the Rancher cluster ID, NOT the kubectl context name. Confirm
  # before installing — it changes whenever the cluster is re-registered:
  #   kubectl --context kind-sims-datacenter get clusters.management.cattle.io \
  #     -o custom-columns='ID:.metadata.name,NAME:.spec.displayName'
  cattle:
    clusterId: c-jhrj6
    clusterName: downstream-1
    rkePathPrefix: ""
    rkeWindowsPathPrefix: ""
    systemDefaultRegistry: registry.rancher.com
    systemProjectId: p-glplv
    url: https://rancher-192-168-1-74.sslip.io:8443
  systemDefaultRegistry: registry.rancher.com

controller:
  # One controller. downstream-1 has three nodes, so unlike the primary this
  # could spread — but the memory budget is the binding constraint, not the
  # node count. See the Step 0 budget in the plan: llama.cpp alone wants ~6 GB
  # of a 14.9 GB MemAvailable shared by both clusters, with no swap.
  replicas: 1

  apisvc:
    # DECISION: create the REST API Service. See the header — this is what
    # makes the sandbox policy's `suse_security` group resolvable.
    #
    # ClusterIP, not NodePort: only in-cluster callers need it. The agents run
    # on this cluster, and the human reads findings through Rancher, not by
    # curling the API. Keeping it ClusterIP means the REST API is not exposed
    # on any node IP, which matters because the podman network is flat — a
    # NodePort here would be reachable from every other kind container.
    type: ClusterIP
    # ctrlServerPort defaults to 10443, which is the port the policy names.
    # Left at the default deliberately; changing it would desynchronise the
    # two files.

  federation:
    managedsvc:
      # DECISION: NodePort, for the same kind-has-no-LoadBalancer reason as
      # the master service on the primary.
      #
      # Direction of travel is worth being precise about, because it is easy
      # to assume both ends dial each other. They do not:
      #
      #   this cluster  --joins-->  https://10.89.0.2:30443   (mastersvc, 11443)
      #   the master    --polls-->  https://10.89.0.3:30444   (managedsvc, 10443)
      #
      # So both services must be reachable, and the managed one has to be
      # exposed on this cluster's node IP even though nothing outside the
      # podman VM will ever call it.
      #
      # 10.89.0.3 is downstream-1-control-plane. Any of the three node IPs
      # works — a NodePort answers on every node — but pin the one you type
      # into the Rancher UI so the join is reproducible.
      type: NodePort
      # Service port is controller.apisvc.ctrlServerPort (10443); this is the
      # node port. 30444 is free on both clusters (verified: no NodePort
      # Services exist anywhere today).
      nodePort: 30444

manager:
  # DECISION: keep the manager, do not disable it.
  #
  # Tempting to drop it — the human reads the federated view on the primary,
  # so a second web UI is redundant and costs ~200-300 MB. Two reasons not to:
  #
  #   1. Rancher's SUSE Security UI extension drives the per-cluster manager
  #      when you switch the Rancher cluster selector to downstream-1. With no
  #      manager, that navigation dead-ends, and the plan's human-in-the-loop
  #      surface #1 ("what did SUSE Security find") half-works in a way that
  #      reads as a bug during a demo.
  #   2. The federation join is performed THROUGH the manager UI on each side.
  #      Removing it means joining by API call only, which is more steps and
  #      more to get wrong.
  #
  # If memory turns out to be the binding constraint after the llama.cpp pod
  # is up, this is the first thing to cut — the join survives a manager that
  # is scaled to zero afterwards.
  enabled: true

cve:
  scanner:
    # One scanner, not three. The scanner is the largest single consumer in
    # the install, and this is the component the validation agent depends on:
    # `POST /v1/scan/repository` is gate #7 in the plan's verification list.
    # One that runs reliably beats three that trigger an OOM kill.
    replicas: 1

# The enforcer is a DaemonSet and is intentionally left alone: downstream-1
# has three nodes, so this install carries three enforcers. That is not
# waste — the enforcer is what gives the scan results something to be about,
# and pinning it to one node would make the findings depend on where a pod
# happened to schedule.
