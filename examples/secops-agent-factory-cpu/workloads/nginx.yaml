# The demo workload: a public-facing web tier, running the UPSTREAM nginx image.
#
# `docker.io/library/nginx:1.31.6` is current mainline — it is not an out-of-date
# nginx, and that is the point. What SUSE Security finds in it is almost entirely
# the Debian base underneath the application, which is why the remediation is a
# move to a SUSE-maintained build of the same nginx version rather than an
# upgrade of nginx itself.
apiVersion: v1
kind: Namespace
metadata:
  name: ns-demo-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ns-demo-web
  labels:
    app.kubernetes.io/name: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
    spec:
      # Pre-wired so that moving to a SUSE-maintained build is a one-line change
      # to the image. The platform team already permits Application Collection
      # images here; withholding the pull secret would only mean the remediation
      # agent's patch fails at the kubelet rather than being reviewed on merit.
      imagePullSecrets:
        - name: appco-pull
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31.6
          ports:
            - { containerPort: 80, name: http }
          resources:
            limits: { cpu: 200m, memory: 128Mi }
            requests: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          readinessProbe:
            httpGet: { path: /, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ns-demo-web
spec:
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - { port: 80, targetPort: http, name: http }
