# The workload the SecOps agents triage, patch and re-scan.
#
# The log4j version below is DELIBERATELY vulnerable: it is affected by corpus
# advisory `cve-2021-44228`, and the remediation agent's whole job is to raise
# it to the `fixed_version` that advisory records.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
  labels:
    app.kubernetes.io/name: payments-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
    spec:
      containers:
        - name: api
          image: registry.example.internal/payments/api:3.4.0
          env:
            # The single line a remediation must change.
            - name: LOG4J_VERSION
              value: "2.14.1"
          ports:
            - containerPort: 8080
