<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76B900"/>
    </marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>

  <text x="40" y="40" font-size="13" font-weight="600" fill="#5a6570">TWO INFERENCE TOPOLOGIES — THE SAME SANDBOX CODE, ONE CONFIGURATION VALUE APART</text>

  <!-- Dedicated -->
  <rect x="40" y="66" width="420" height="300" rx="9" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="250" y="94" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">Dedicated engine per tenant</text>
  <text x="250" y="114" font-size="11" fill="#5a6570" text-anchor="middle">maximum isolation</text>

  <rect x="66" y="132" width="180" height="210" rx="7" fill="#fafbfc" stroke="#cfd8dc"/>
  <text x="156" y="154" font-size="11" font-weight="600" fill="#3d4852" text-anchor="middle">tenant-a</text>
  <rect x="82" y="166" width="148" height="46" rx="5" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="156" y="194" font-size="11" fill="#1a1a1a" text-anchor="middle">sandboxes</text>
  <line x1="156" y1="212" x2="156" y2="248" stroke="#76B900" stroke-width="1.6" marker-end="url(#arrow4)"/>
  <rect x="82" y="252" width="148" height="70" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="1.6"/>
  <text x="156" y="280" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">engine</text>
  <text x="156" y="300" font-size="10" fill="#5a6570" text-anchor="middle">own model copy</text>

  <rect x="254" y="132" width="180" height="210" rx="7" fill="#fafbfc" stroke="#cfd8dc"/>
  <text x="344" y="154" font-size="11" font-weight="600" fill="#3d4852" text-anchor="middle">tenant-b</text>
  <rect x="270" y="166" width="148" height="46" rx="5" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="344" y="194" font-size="11" fill="#1a1a1a" text-anchor="middle">sandboxes</text>
  <line x1="344" y1="212" x2="344" y2="248" stroke="#76B900" stroke-width="1.6" marker-end="url(#arrow4)"/>
  <rect x="270" y="252" width="148" height="70" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="1.6"/>
  <text x="344" y="280" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">engine</text>
  <text x="344" y="300" font-size="10" fill="#5a6570" text-anchor="middle">own model copy</text>

  <!-- Shared -->
  <rect x="500" y="66" width="420" height="300" rx="9" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="710" y="94" font-size="14" font-weight="600" fill="#1a1a1a" text-anchor="middle">Shared engine</text>
  <text x="710" y="114" font-size="11" fill="#5a6570" text-anchor="middle">maximum GPU efficiency</text>

  <rect x="526" y="132" width="180" height="112" rx="7" fill="#fafbfc" stroke="#cfd8dc"/>
  <text x="616" y="154" font-size="11" font-weight="600" fill="#3d4852" text-anchor="middle">tenant-a</text>
  <rect x="542" y="166" width="148" height="46" rx="5" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="616" y="194" font-size="11" fill="#1a1a1a" text-anchor="middle">sandboxes</text>

  <rect x="714" y="132" width="180" height="112" rx="7" fill="#fafbfc" stroke="#cfd8dc"/>
  <text x="804" y="154" font-size="11" font-weight="600" fill="#3d4852" text-anchor="middle">tenant-b</text>
  <rect x="730" y="166" width="148" height="46" rx="5" fill="#ffffff" stroke="#cfd8dc"/>
  <text x="804" y="194" font-size="11" fill="#1a1a1a" text-anchor="middle">sandboxes</text>

  <path d="M 616 212 L 616 258 L 710 258" fill="none" stroke="#76B900" stroke-width="1.6"/>
  <path d="M 804 212 L 804 258 L 710 258" fill="none" stroke="#76B900" stroke-width="1.6"/>
  <line x1="710" y1="258" x2="710" y2="272" stroke="#76B900" stroke-width="1.6" marker-end="url(#arrow4)"/>

  <rect x="620" y="272" width="180" height="70" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="1.6"/>
  <text x="710" y="300" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">one engine</text>
  <text x="710" y="320" font-size="10" fill="#5a6570" text-anchor="middle">one model copy, shared queue</text>

  <text x="40" y="398" font-size="11" fill="#5a6570">Sandboxes always call the same virtual endpoint. Moving a tenant between topologies changes a route, not an image or a manifest.</text>
</svg>
