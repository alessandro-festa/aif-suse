<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0C322C"/>
    </marker>
    <marker id="arrow-f3-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2453FF"/>
    </marker>
    <marker id="arrow-f3-nv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#76B900"/>
    </marker>
  </defs>
  <rect width="1160" height="900" fill="#ffffff"/>

  <text x="40" y="38" font-size="20" font-weight="700" fill="#0C322C">Six recurring execution paths — and how often each one turns</text>
  <text x="40" y="60" font-size="12" fill="#5a6570">A long-running agent architecture is defined by its loops, not its boxes. These six run on periods four orders of magnitude apart.</text>

  <!-- ===================== Model plane band ===================== -->
  <rect x="60" y="84" width="1042" height="62" rx="8" fill="#fcfdfa" stroke="#76B900" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="76" y="102" font-size="10" font-weight="700" fill="#76B900">NVIDIA MODEL PLANE — NIM OPERATOR</text>
  <rect x="76" y="108" width="240" height="30" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="196" y="121" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">Nemotron 3 Ultra 550B-A55B</text>
  <text x="196" y="133" font-size="9" fill="#5a6570" text-anchor="middle">plans, routes, writes</text>
  <rect x="328" y="108" width="240" height="30" rx="5" fill="#eef6dd" stroke="#76B900" stroke-width="2.4"/>
  <text x="448" y="121" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">Nemotron 3.5 Lightning 30B-A3B</text>
  <text x="448" y="133" font-size="9" fill="#5a6570" text-anchor="middle">executes — the tier loop 6 improves</text>
  <rect x="580" y="108" width="240" height="30" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="700" y="121" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">Nemotron 3 Embed + Rerank VL</text>
  <text x="700" y="133" font-size="9" fill="#5a6570" text-anchor="middle">retrieval</text>
  <rect x="832" y="108" width="254" height="30" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="959" y="121" font-size="10" font-weight="700" fill="#1a1a1a" text-anchor="middle">NeMo Guardrails</text>
  <text x="959" y="133" font-size="9" fill="#5a6570" text-anchor="middle">intercepts every call above</text>

  <!-- ===================== Loop 2 — escalation ===================== -->
  <path d="M 251 290 L 251 216 L 515 216 L 515 290"
        fill="none" stroke="#2453FF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-f3-loop)"/>
  <rect x="308" y="204" width="150" height="22" rx="11" fill="#eef2ff" stroke="#2453FF" stroke-width="1.4"/>
  <text x="383" y="219" font-size="10" font-weight="700" fill="#2453FF" text-anchor="middle">L2 · escalation — minutes</text>

  <!-- ===================== Loop 1 — agent turn ===================== -->
  <path d="M 690 290 L 690 262 L 604 262 L 604 290"
        fill="none" stroke="#2453FF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-f3-loop)"/>
  <rect x="712" y="251" width="142" height="22" rx="11" fill="#eef2ff" stroke="#2453FF" stroke-width="1.4"/>
  <text x="783" y="266" font-size="10" font-weight="700" fill="#2453FF" text-anchor="middle">L1 · agent turn — seconds</text>

  <!-- ===================== Stage row ===================== -->
  <rect x="60" y="290" width="118" height="76" rx="6" fill="#f7f9fa" stroke="#0C322C" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="119" y="312" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Signal</text>
  <text x="119" y="329" font-size="8.5" fill="#5a6570" text-anchor="middle">SUSE Security finding,</text>
  <text x="119" y="341" font-size="8.5" fill="#5a6570" text-anchor="middle">CVE feed, SBOM delta</text>
  <text x="119" y="356" font-size="8.5" font-weight="600" fill="#0C322C" text-anchor="middle">prerequisite</text>

  <rect x="192" y="290" width="118" height="76" rx="6" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="251" y="312" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Triage</text>
  <text x="251" y="329" font-size="8.5" fill="#5a6570" text-anchor="middle">Lightning — dedupe,</text>
  <text x="251" y="341" font-size="8.5" fill="#5a6570" text-anchor="middle">rank by reachability</text>
  <text x="251" y="356" font-size="8.5" font-weight="600" fill="#76B900" text-anchor="middle">most findings end here</text>

  <rect x="324" y="290" width="118" height="76" rx="6" fill="#fff6f0" stroke="#FE7C3F" stroke-width="2"/>
  <text x="383" y="312" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Plan gate</text>
  <text x="383" y="329" font-size="8.5" fill="#5a6570" text-anchor="middle">clarifier states a plan,</text>
  <text x="383" y="341" font-size="8.5" fill="#5a6570" text-anchor="middle">a human accepts it</text>
  <text x="383" y="356" font-size="8.5" font-weight="600" fill="#FE7C3F" text-anchor="middle">blast-radius control</text>

  <rect x="456" y="290" width="118" height="76" rx="6" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="515" y="312" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Research</text>
  <text x="515" y="329" font-size="8.5" fill="#5a6570" text-anchor="middle">Ultra orchestrates,</text>
  <text x="515" y="341" font-size="8.5" fill="#5a6570" text-anchor="middle">N workers in parallel</text>
  <text x="515" y="356" font-size="8.5" font-weight="600" fill="#76B900" text-anchor="middle">the token volume</text>

  <rect x="588" y="290" width="118" height="76" rx="6" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="647" y="312" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Remediate</text>
  <text x="647" y="329" font-size="8.5" fill="#5a6570" text-anchor="middle">OpenShell sandbox —</text>
  <text x="647" y="341" font-size="8.5" fill="#5a6570" text-anchor="middle">patch, build, open PR</text>
  <text x="647" y="356" font-size="8.5" font-weight="600" fill="#76B900" text-anchor="middle">the only side effects</text>

  <rect x="720" y="290" width="118" height="76" rx="6" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="779" y="312" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Validate</text>
  <text x="779" y="329" font-size="8.5" fill="#5a6570" text-anchor="middle">rebuild, then rescan</text>
  <text x="779" y="341" font-size="8.5" fill="#5a6570" text-anchor="middle">with SUSE Security</text>
  <text x="779" y="356" font-size="8.5" font-weight="600" fill="#0C322C" text-anchor="middle">graded by a third party</text>

  <rect x="852" y="290" width="118" height="76" rx="6" fill="#fff6f0" stroke="#FE7C3F" stroke-width="2"/>
  <text x="911" y="312" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Approve</text>
  <text x="911" y="329" font-size="8.5" fill="#5a6570" text-anchor="middle">pull-request review;</text>
  <text x="911" y="341" font-size="8.5" fill="#5a6570" text-anchor="middle">merge is denied to the</text>
  <text x="911" y="353" font-size="8.5" fill="#5a6570" text-anchor="middle">agent by policy</text>

  <rect x="984" y="290" width="118" height="76" rx="6" fill="#f7f9fa" stroke="#0C322C" stroke-width="1.4"/>
  <text x="1043" y="312" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Apply</text>
  <text x="1043" y="329" font-size="8.5" fill="#5a6570" text-anchor="middle">Fleet GitOps rolls the</text>
  <text x="1043" y="341" font-size="8.5" fill="#5a6570" text-anchor="middle">merged change out</text>
  <text x="1043" y="356" font-size="8.5" font-weight="600" fill="#0C322C" text-anchor="middle">no agent kubeconfig</text>

  <!-- forward arrows -->
  <path d="M 178 328 L 190 328" fill="none" stroke="#0C322C" stroke-width="1.8" marker-end="url(#arrow-f3)"/>
  <path d="M 310 328 L 322 328" fill="none" stroke="#0C322C" stroke-width="1.8" marker-end="url(#arrow-f3)"/>
  <path d="M 442 328 L 454 328" fill="none" stroke="#0C322C" stroke-width="1.8" marker-end="url(#arrow-f3)"/>
  <path d="M 574 328 L 586 328" fill="none" stroke="#0C322C" stroke-width="1.8" marker-end="url(#arrow-f3)"/>
  <path d="M 706 328 L 718 328" fill="none" stroke="#0C322C" stroke-width="1.8" marker-end="url(#arrow-f3)"/>
  <path d="M 838 328 L 850 328" fill="none" stroke="#0C322C" stroke-width="1.8" marker-end="url(#arrow-f3)"/>
  <path d="M 970 328 L 982 328" fill="none" stroke="#0C322C" stroke-width="1.8" marker-end="url(#arrow-f3)"/>

  <!-- ===================== Loop 3 — validation ===================== -->
  <path d="M 779 366 L 779 400 L 659 400 L 659 366"
        fill="none" stroke="#2453FF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-f3-loop)"/>
  <rect x="240" y="389" width="204" height="22" rx="11" fill="#eef2ff" stroke="#2453FF" stroke-width="1.4"/>
  <text x="342" y="404" font-size="10" font-weight="700" fill="#2453FF" text-anchor="middle">L3 · validation — minutes to hours</text>

  <!-- ===================== Loop 4 — human rejection ===================== -->
  <path d="M 930 366 L 930 444 L 635 444 L 635 366"
        fill="none" stroke="#FE7C3F" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-f3-loop)"/>
  <rect x="660" y="433" width="188" height="22" rx="11" fill="#fff6f0" stroke="#FE7C3F" stroke-width="1.4"/>
  <text x="754" y="448" font-size="10" font-weight="700" fill="#FE7C3F" text-anchor="middle">L4 · human verdict — hours</text>

  <!-- ===================== Knowledge plane ===================== -->
  <rect x="300" y="486" width="520" height="60" rx="8" fill="#f7f9fa" stroke="#0C322C" stroke-width="1.4"/>
  <text x="316" y="506" font-size="10" font-weight="700" fill="#5a6570">KNOWLEDGE PLANE — NVIDIA RAG BLUEPRINT v2.6.0 OVER A VULNERABILITY CORPUS</text>
  <text x="316" y="524" font-size="9.5" fill="#3d4852">CVE records · SUSE-SU errata · SBOMs · SUSE Security scan exports · internal remediation runbooks</text>
  <text x="316" y="538" font-size="9.5" fill="#5a6570">Nemotron 3 Embed 1B + Rerank VL 1B · hybrid search, sparse-weighted — a NEVRA must match literally</text>

  <path d="M 515 486 L 515 370" fill="none" stroke="#76B900" stroke-width="1.8" marker-end="url(#arrow-f3-nv)"/>
  <text x="524" y="470" font-size="10" font-weight="600" fill="#76B900">retrieve and rerank</text>

  <!-- ===================== Loop 5 — nightly ingestion ===================== -->
  <!-- The same feeds that raise a signal also refresh the corpus overnight, so
       this loop leaves from the signal stage rather than from the end of a run. -->
  <path d="M 119 366 L 119 516 L 294 516"
        fill="none" stroke="#2453FF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-f3-loop)"/>
  <rect x="96" y="524" width="186" height="22" rx="11" fill="#eef2ff" stroke="#2453FF" stroke-width="1.4"/>
  <text x="189" y="539" font-size="10" font-weight="700" fill="#2453FF" text-anchor="middle">L5 · ingestion — nightly</text>

  <!-- ===================== Loop 6 — data flywheel ===================== -->
  <path d="M 942 366 L 942 566 L 121 566 L 121 588"
        fill="none" stroke="#2453FF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-f3-loop)"/>

  <rect x="60" y="588" width="1042" height="104" rx="8" fill="#fcfdfa" stroke="#76B900" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="76" y="608" font-size="10" font-weight="700" fill="#76B900">L6 · DATA FLYWHEEL — WEEKLY · NVIDIA NEMO (SUPERSEDED BY NEMO PLATFORM FROM 1 OCTOBER 2026)</text>

  <rect x="76" y="616" width="186" height="62" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="169" y="634" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">NeMo Relay</text>
  <text x="169" y="648" font-size="8.5" fill="#5a6570" text-anchor="middle">ATIF trajectories, including</text>
  <text x="169" y="659" font-size="8.5" fill="#5a6570" text-anchor="middle">subagent_trajectories — the</text>
  <text x="169" y="670" font-size="8.5" fill="#5a6570" text-anchor="middle">orchestrator–worker tree</text>
  <path d="M 262 647 L 278 647" fill="none" stroke="#76B900" stroke-width="1.8" marker-end="url(#arrow-f3-nv)"/>

  <rect x="280" y="616" width="186" height="62" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="373" y="634" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">NeMo Data Store</text>
  <text x="373" y="648" font-size="8.5" fill="#5a6570" text-anchor="middle">the corpus of what the</text>
  <text x="373" y="659" font-size="8.5" fill="#5a6570" text-anchor="middle">system actually did, and</text>
  <text x="373" y="670" font-size="8.5" fill="#5a6570" text-anchor="middle">what a human said about it</text>
  <path d="M 466 647 L 482 647" fill="none" stroke="#76B900" stroke-width="1.8" marker-end="url(#arrow-f3-nv)"/>

  <rect x="484" y="616" width="186" height="62" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="577" y="634" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">NeMo Evaluator</text>
  <text x="577" y="648" font-size="8.5" fill="#5a6570" text-anchor="middle">LLM-as-judge on a five-</text>
  <text x="577" y="659" font-size="8.5" fill="#5a6570" text-anchor="middle">criterion rubric; the merged</text>
  <text x="577" y="670" font-size="8.5" fill="#5a6570" text-anchor="middle">PR is the ground truth</text>
  <path d="M 670 647 L 686 647" fill="none" stroke="#76B900" stroke-width="1.8" marker-end="url(#arrow-f3-nv)"/>

  <rect x="688" y="616" width="186" height="62" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="781" y="634" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">NeMo Customizer</text>
  <text x="781" y="648" font-size="8.5" fill="#5a6570" text-anchor="middle">LoRA-tunes Lightning on</text>
  <text x="781" y="659" font-size="8.5" fill="#5a6570" text-anchor="middle">accepted trajectories only</text>
  <path d="M 874 647 L 890 647" fill="none" stroke="#76B900" stroke-width="1.8" marker-end="url(#arrow-f3-nv)"/>

  <rect x="892" y="616" width="194" height="62" rx="5" fill="#f4f8ee" stroke="#76B900" stroke-width="2"/>
  <text x="989" y="634" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">NIM Operator</text>
  <text x="989" y="648" font-size="8.5" fill="#5a6570" text-anchor="middle">serves the new adapter as</text>
  <text x="989" y="659" font-size="8.5" fill="#5a6570" text-anchor="middle">a NIM — the cheap model</text>
  <text x="989" y="670" font-size="8.5" fill="#5a6570" text-anchor="middle">absorbs the routine cases</text>

  <!-- flywheel return to the model plane -->
  <path d="M 1102 647 L 1132 647 L 1132 74 L 448 74 L 448 84"
        fill="none" stroke="#2453FF" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-f3-loop)"/>
  <text x="1124" y="68" font-size="10" font-weight="700" fill="#2453FF" text-anchor="end">L6 returns here — this is what makes it a factory, not a pipeline</text>

  <!-- ===================== Legend / period table ===================== -->
  <rect x="40" y="716" width="1080" height="158" rx="8" fill="#fbfcfc" stroke="#cfd8dc"/>
  <text x="60" y="738" font-size="11" font-weight="700" fill="#0C322C">THE SIX LOOPS, BY PERIOD — FOUR ORDERS OF MAGNITUDE APART, WHICH IS WHY THEY NEED DIFFERENT MODELS AND DIFFERENT BUDGETS</text>

  <text x="60" y="762" font-size="10.5" font-weight="700" fill="#2453FF">L1  agent turn · seconds</text>
  <text x="60" y="776" font-size="9.5" fill="#3d4852">plan → act → observe → reflect, bounded by max_tool_iterations and max_llm_turns</text>
  <text x="60" y="800" font-size="10.5" font-weight="700" fill="#2453FF">L2  escalation · minutes</text>
  <text x="60" y="814" font-size="9.5" fill="#3d4852">shallow research insufficient → deep research; Lightning → Ultra. Effort scaled to complexity</text>
  <text x="60" y="838" font-size="10.5" font-weight="700" fill="#2453FF">L3  validation · minutes to hours</text>
  <text x="60" y="852" font-size="9.5" fill="#3d4852">patch → rebuild → SUSE Security rescan → scan diff back to the agent. Terminates clean or out of budget</text>

  <text x="600" y="762" font-size="10.5" font-weight="700" fill="#FE7C3F">L4  human verdict · hours</text>
  <text x="600" y="776" font-size="9.5" fill="#3d4852">the plan gate and the PR review. The verdict is captured as a training signal, not discarded</text>
  <text x="600" y="800" font-size="10.5" font-weight="700" fill="#2453FF">L5  ingestion · nightly</text>
  <text x="600" y="814" font-size="9.5" fill="#3d4852">new CVEs, SUSE-SU errata, fresh SBOMs and scan exports re-enter the corpus</text>
  <text x="600" y="838" font-size="10.5" font-weight="700" fill="#2453FF">L6  data flywheel · weekly</text>
  <text x="600" y="852" font-size="9.5" fill="#3d4852">accepted trajectories LoRA-tune the executor, so routine work migrates from the 550B to the 30B</text>
</svg>
