suite: training chart ClusterRepo
templates:
  - templates/training-chart-repo.yaml
tests:
  - it: points gpu-train-charts at the training chart released with the operator
    asserts:
      - isKind:
          of: ClusterRepo
      - equal:
          path: metadata.name
          value: gpu-train-charts
      - equal:
          path: spec.url
          value: oci://ghcr.io/suse/chart/gpu-train-job
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: follows a mirror
    set:
      trainingChart.clusterRepo.url: oci://registry.example.com/charts/gpu-train-job
    asserts:
      - equal:
          path: spec.url
          value: oci://registry.example.com/charts/gpu-train-job

  - it: leaves the ClusterRepo to the administrator when create is off
    set:
      trainingChart.clusterRepo.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: does not take over a ClusterRepo another owner created
    kubernetesProvider:
      scheme:
        "catalog.cattle.io/v1/ClusterRepo":
          gvr:
            version: "v1"
            group: "catalog.cattle.io"
            resource: "clusterrepos"
          namespaced: false
      objects:
        - kind: ClusterRepo
          apiVersion: catalog.cattle.io/v1
          metadata:
            name: gpu-train-charts
    asserts:
      - hasDocuments:
          count: 0
