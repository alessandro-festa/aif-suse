---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: aiprojects.ai-factory.suse.com
spec:
  group: ai-factory.suse.com
  names:
    kind: AIProject
    listKind: AIProjectList
    plural: aiprojects
    shortNames:
    - aiproj
    singular: aiproject
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AIProject is a team's AI work across clusters: who is in it, and the clusters
          and namespaces its training runs on. The operator keeps a namespace on local
          for its AIJobs (aif-<name>), and on every cluster it spans a Rancher project,
          a namespace, and Rancher role bindings for its members, so they reach their
          runs everywhere through Rancher.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AIProjectSpec is set by AI Factory administrators: the object is
              cluster-scoped, so only they can write it. Members beyond the owners are in
              the project's AIProjectMembers, which its owners may edit.
            properties:
              clusters:
                description: |-
                  Clusters the project runs work on. A job is placed on a compute pool of one
                  of them.
                items:
                  description: AIProjectCluster is one cluster an AI project runs
                    work on.
                  properties:
                    clusterId:
                      description: ClusterID is the Rancher cluster ID of a downstream
                        cluster.
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: Rancher's local cluster runs no AI work
                        rule: self != 'local'
                    namespace:
                      description: |-
                        Namespace is the project's namespace there, where its jobs run. Created in
                        the project's Rancher project when missing.
                      maxLength: 63
                      minLength: 1
                      type: string
                    projectId:
                      description: |-
                        ProjectID adopts an existing Rancher project on the cluster (e.g.
                        "p-abc12"). Empty: the operator creates one, named after the AI project.
                      type: string
                  required:
                  - clusterId
                  - namespace
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - clusterId
                x-kubernetes-list-type: map
              displayName:
                type: string
              owners:
                description: Owners are always owners, whatever the members list says.
                items:
                  description: AIProjectSubject is a Rancher user or group.
                  properties:
                    kind:
                      description: |-
                        Kind is User (a Rancher user ID, e.g. "user-2khzq") or Group (a group
                        principal, e.g. "github_team://42").
                      enum:
                      - User
                      - Group
                      type: string
                    name:
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                minItems: 1
                type: array
            required:
            - clusters
            - owners
            type: object
          status:
            description: AIProjectStatus says where the project's pieces are.
            properties:
              clusters:
                items:
                  description: AIProjectClusterStatus is what the operator set up
                    on one cluster.
                  properties:
                    clusterId:
                      type: string
                    message:
                      type: string
                    namespace:
                      description: Namespace is the project's namespace on the cluster.
                      type: string
                    projectId:
                      description: ProjectID is the Rancher project the namespace
                        is in.
                      type: string
                    ready:
                      description: |-
                        Ready is true when the Rancher project, the namespace and the members'
                        role bindings are in place.
                      type: boolean
                  required:
                  - clusterId
                  - ready
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              namespace:
                description: Namespace is the project's namespace on local, where
                  its AIJobs live.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
