---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: aijobs.ai-factory.suse.com
spec:
  group: ai-factory.suse.com
  names:
    kind: AIJob
    listKind: AIJobList
    plural: aijobs
    shortNames:
    - aijob
    singular: aijob
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display Name
      type: string
    - jsonPath: .spec.category
      name: Category
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.startedAt
      name: Started
      priority: 1
      type: date
    - jsonPath: .status.completedAt
      name: Completed
      priority: 1
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AIJob is the durable record of one finite execution: what was submitted,
          where it ran, how it ended. The operator installs the execution from the
          spec, copies its facts into the status, and removes the execution objects
          when their retention passes; the record stays.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AIJobSpec is the whole statement of intent. Source and values are fixed at
              creation: a change of intent is a new job.
            properties:
              cancel:
                description: |-
                  Cancel stops a job that has not finished: the operator uninstalls the
                  release and the job ends Cancelled. It cannot be set back to false.
                type: boolean
              category:
                description: Category says what the job is for. Informational.
                enum:
                - inference
                - training
                - agent
                - rag
                - data
                - custom
                type: string
              displayName:
                description: DisplayName is a human-readable name. Informational.
                type: string
              profile:
                description: Profile names the profile that chose the values. Informational.
                type: string
              retention:
                description: Retention bounds how long the execution objects are kept.
                properties:
                  executionObjects:
                    default: 168h
                    description: |-
                      ExecutionObjects is how long the release and everything it created (Job,
                      pods, Kueue Workload, claims, ephemeral PVCs) stay after the job completes.
                      The AIJob itself is kept.
                    type: string
                type: object
              source:
                description: |-
                  Source is a custom chart to install. Omit it to install the training chart
                  built into the operator (charts/gpu-train-job at the operator's version),
                  which needs no chart repository.
                properties:
                  chartName:
                    description: ChartName is the Helm chart name in that repository.
                    minLength: 1
                    type: string
                  repoName:
                    description: RepoName is the Rancher ClusterRepo name.
                    minLength: 1
                    type: string
                  version:
                    description: Version is the exact chart version.
                    minLength: 1
                    type: string
                required:
                - chartName
                - repoName
                - version
                type: object
              values:
                description: |-
                  Values are the chart values as submitted.
                  Typed as an object so the immutability rule on the spec can compare it.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            type: object
            x-kubernetes-validations:
            - message: spec.source is immutable; submit a new AIJob
              rule: has(self.source) == has(oldSelf.source) && (!has(self.source)
                || self.source == oldSelf.source)
            - message: spec.values is immutable; submit a new AIJob
              rule: has(self.values) == has(oldSelf.values) && (!has(self.values)
                || self.values == oldSelf.values)
            - message: spec.cancel cannot be undone
              rule: '!has(oldSelf.cancel) || !oldSelf.cancel || (has(self.cancel)
                && self.cancel)'
          status:
            description: |-
              AIJobStatus is written by the operator only. Timestamps are observed facts;
              durations are computed by readers.
            properties:
              admittedAt:
                format: date-time
                type: string
              cleanup:
                description: AIJobCleanup tracks removal of the execution objects.
                properties:
                  completedAt:
                    format: date-time
                    type: string
                  dueAt:
                    format: date-time
                    type: string
                type: object
              completedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              execution:
                description: AIJobExecution names what the release created to run
                  the job.
                properties:
                  kind:
                    description: Kind is Job or PyTorchJob.
                    type: string
                  name:
                    description: Name of the Job or PyTorchJob.
                    type: string
                  release:
                    description: Release is the Helm release name (the AIJob name).
                    type: string
                type: object
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  AIJobPhase is where a finite execution is in its life. Succeeded, Failed and
                  Cancelled are terminal and never change afterwards.
                enum:
                - Pending
                - Queued
                - Admitted
                - Running
                - Succeeded
                - Failed
                - Cancelled
                type: string
              podCounts:
                description: AIJobPodCounts summarises pods by phase when there are
                  too many to list.
                properties:
                  failed:
                    format: int32
                    type: integer
                  pending:
                    format: int32
                    type: integer
                  running:
                    format: int32
                    type: integer
                  succeeded:
                    format: int32
                    type: integer
                type: object
              pods:
                description: |-
                  Pods lists every pod up to 16; above that only failed pods, with
                  PodCounts holding the totals.
                items:
                  description: AIJobPod is the facts about one pod, copied while it
                    exists.
                  properties:
                    exitCode:
                      format: int32
                      type: integer
                    message:
                      type: string
                    name:
                      type: string
                    node:
                      type: string
                    phase:
                      type: string
                    reason:
                      type: string
                    restarts:
                      format: int32
                      type: integer
                  required:
                  - name
                  type: object
                type: array
              queue:
                description: AIJobQueue records the Kueue Workload that queued the
                  job.
                properties:
                  clusterQueue:
                    type: string
                  kaiQueue:
                    description: |-
                      KAIQueue is the KAI Scheduler queue the pods were submitted to (their
                      kai.scheduler/queue label), for a job KAI queues rather than Kueue.
                    type: string
                  localQueue:
                    type: string
                  workload:
                    type: string
                type: object
              report:
                description: Report is what the run reported about itself, for a run
                  that prints one.
                properties:
                  checks:
                    items:
                      description: 'AIJobReportCheck is one check in a report: passed,
                        passed with a warning, or failed.'
                      properties:
                        detail:
                          type: string
                        name:
                          type: string
                        ok:
                          type: boolean
                        warn:
                          type: boolean
                      required:
                      - name
                      - ok
                      type: object
                    maxItems: 50
                    type: array
                  env:
                    additionalProperties:
                      type: string
                    description: 'Env describes where it ran: driver, GPU, node.'
                    type: object
                  metrics:
                    additionalProperties:
                      type: string
                    description: Metrics are the measurements, e.g. bus bandwidth,
                      as text.
                    type: object
                  pod:
                    description: Pod is the pod whose log the report was read from.
                    type: string
                  reportedAt:
                    format: date-time
                    type: string
                  status:
                    description: 'Status is the run''s own verdict: pass or fail.'
                    type: string
                  test:
                    description: Test names what reported, e.g. "GPU Smoke Test".
                    type: string
                type: object
              resources:
                description: AIJobResources records what the job was given.
                properties:
                  gpuCount:
                    format: int32
                    type: integer
                  gpus:
                    items:
                      description: AIJobGPU is one GPU a pod was given.
                      properties:
                        claim:
                          description: Claim is the ResourceClaim the device was allocated
                            through (DRA only).
                          type: string
                        device:
                          description: Device is the DRA device name (DRA only).
                          type: string
                        mode:
                          description: Mode is dra or device-plugin.
                          type: string
                        pod:
                          type: string
                        pool:
                          description: Pool is the DRA pool, usually the node (DRA
                            only).
                          type: string
                        product:
                          description: Product is the GPU model, from the node's nvidia.com/gpu.product
                            label.
                          type: string
                      required:
                      - mode
                      - pod
                      type: object
                    type: array
                type: object
              result:
                description: AIJobResult is how the job ended. Final once the phase
                  is terminal.
                properties:
                  exitCode:
                    format: int32
                    type: integer
                  message:
                    type: string
                  reason:
                    type: string
                type: object
              startedAt:
                format: date-time
                type: string
              submittedAt:
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
