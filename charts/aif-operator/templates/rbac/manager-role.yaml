apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  name: {{ include "aif-operator.fullname" . }}
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - services
    verbs:
      - delete
      - get
      - list
      # `watch` is required by installaiextension_controller's reconciler cache
      # (kubebuilder marker on services is get;list;watch). Without it, the
      # operator's controller-runtime informer for *v1.Service fails to start
      # and hot-loops the kube-apiserver with rejected watch requests. Verb
      # also applies to configmaps + PVCs in this rule, harmless — both
      # already have list permission, so watch adds no extra read surface.
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - replicasets
      - statefulsets
    verbs:
      - delete
      - get
      - list
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - delete
      - get
      - list
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - installaiextensions
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - installaiextensions/finalizers
    verbs:
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - installaiextensions/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
  - apiGroups:
      - catalog.cattle.io
    resources:
      - clusterrepos
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - catalog.cattle.io
    resources:
      - clusterrepos/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - settings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - settings/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - blueprintcatalogs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - blueprints
    verbs:
      - get
      - list
      - watch
      - patch
      - create
      - delete
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - aiworkloads
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - aiworkloads/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - aiworkloads/finalizers
    verbs:
      - update
  - apiGroups:
      - fleet.cattle.io
    resources:
      - bundledeployments
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - fleet.cattle.io
    resources:
      - bundles
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - fleet.cattle.io
    resources:
      - gitrepos
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - fleet.cattle.io
    resources:
      - helmops
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # AIJob (internal/controller/aijob): the record itself, and what installing a
  # finite execution's chart needs. The operator installs the release with this
  # service account, which is why --aijob-allowed-charts bounds the charts.
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - aijobs
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - aijobs/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - aijobs/finalizers
    verbs:
      - update
  # A finished AIJob keeps the result its run reported: read once from the
  # first worker's log.
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - kubeflow.org
    resources:
      - pytorchjobs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - kueue.x-k8s.io
    resources:
      - workloads
    verbs:
      - get
      - list
      - watch
  # A training chart's install-time pre-flight looks these up (the queue it
  # names exists, GPUs and DRA devices are there); read-only.
  - apiGroups:
      - kueue.x-k8s.io
    resources:
      - localqueues
      - clusterqueues
    verbs:
      - get
      - list
  - apiGroups:
      - scheduling.run.ai
    resources:
      - queues
    verbs:
      - get
      - list
  - apiGroups:
      - resource.k8s.io
    resources:
      - deviceclasses
      - resourceslices
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaims
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceclaimtemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - resource.nvidia.com
    resources:
      - computedomains
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch

  # Events on the objects the operator reconciles wherever they live (an AIJob is in
  # its submitter's namespace); the namespaced Roles only cover the operator's own.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Compute pools: the operator discovers them from every Rancher cluster and
  # refreshes their status. Downstream clusters are read through Rancher's proxy
  # with the Settings token, under that token's own permissions.
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - computepools
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ai-factory.suse.com
    resources:
      - computepools/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - management.cattle.io
    resources:
      - clusters
    verbs:
      - get
      - list
      - watch
---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    {{- include "aif-operator.labels" . | nindent 4 }}
  name: {{ include "aif-operator.fullname" . }}
  namespace: {{ include "aif-operator.extensionsNamespace" . }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - services
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - catalog.cattle.io
    resources:
      - uiplugins
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - catalog.cattle.io
    resources:
      - uiplugins/status
    verbs:
      - get
      - patch
      - update
