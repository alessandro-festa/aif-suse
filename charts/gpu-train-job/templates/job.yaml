{{- if eq .Values.job.kind "job" }}
{{- $full := include "gpu-train-job.fullname" . -}}
{{- include "gpu-train-job.preflight" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $full }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gpu-train-job.labels" . | nindent 4 }}
    {{- with include "gpu-train-job.queueWorkloadLabels" . }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  completionMode: Indexed
  completions: {{ .Values.job.nodes }}
  parallelism: {{ .Values.job.nodes }}
  backoffLimitPerIndex: {{ .Values.job.backoffLimitPerIndex }}
  maxFailedIndexes: 0
  {{- /* A drained or preempted node does not cost a retry; an exit code that says "this will not
         succeed again" (job.failFastExitCodes) fails the run at once instead of retrying it. */}}
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      {{- with .Values.job.failFastExitCodes }}
      - action: FailIndex
        onExitCodes:
          containerName: trainer
          operator: In
          values: {{ toJson . }}
      {{- end }}
  {{- if include "gpu-train-job.suspended" . }}
  suspend: true
  {{- end }}
  {{- if gt (int .Values.job.activeDeadlineSeconds) 0 }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  {{- end }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "gpu-train-job.podLabels" . | nindent 8 }}
        {{- with (include "gpu-train-job.queuePodLabels" . | trim) }}
          {{- . | nindent 8 }}
        {{- end }}
      {{- with (include "gpu-train-job.podAnnotations" . | trim) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      subdomain: {{ $full }}
      restartPolicy: Never
      terminationGracePeriodSeconds: {{ .Values.job.terminationGracePeriodSeconds }}
      {{- with (include "gpu-train-job.podNetwork" . | trim) }}
        {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "gpu-train-job.podScheduling" . | trim) }}
        {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "gpu-train-job.affinity" . | trim) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- if eq (include "gpu-train-job.gpuMode" .) "dra" }}
      resourceClaims:
        - name: gpu
          {{- if .Values.gpu.sharedClaim }}
          resourceClaimName: {{ .Values.gpu.sharedClaim }}
          {{- else }}
          resourceClaimTemplateName: {{ $full }}-gpu
          {{- end }}
        {{- if .Values.computeDomain.enabled }}
        - name: compute-domain
          resourceClaimTemplateName: {{ $full }}-cd-channel
        {{- end }}
      {{- end }}
      volumes:
        {{- include "gpu-train-job.volumes" . | trim | nindent 8 }}
      containers:
        {{- include "gpu-train-job.trainerContainer" (dict "ctx" . "kind" "job") | trim | nindent 8 }}
{{- end }}
