apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: t-fraction-cpu
  namespace: aif-submit
spec:
  runtimeRef:
    name: aif-cpu
  trainer:
    numNodes: 1
    command:
    - python
    - -c
    - print('hi')
  runtimePatches:
  - manager: ai-factory.suse.com/policy-test
    trainingRuntimeSpec:
      template:
        spec:
          replicatedJobs:
          - name: node
            template:
              spec:
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: aif-submit
                    annotations:
                      gpu-fraction: '1'
