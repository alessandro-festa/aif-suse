apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: t-pvc
  namespace: aif-submit
spec:
  runtimeRef:
    name: aif-share-4g
  trainer:
    numNodes: 1
    command:
    - python
    - -c
    - print('hi')
  runtimePatches:
  - manager: ai-factory.suse.com/policy-test
    trainingRuntimeSpec:
      template:
        spec:
          replicatedJobs:
          - name: node
            template:
              spec:
                template:
                  metadata:
                    labels:
                      kai.scheduler/queue: aif-submit
                  spec:
                    volumes:
                    - name: d
                      persistentVolumeClaim:
                        claimName: datasets
                    containers:
                    - name: node
                      volumeMounts:
                      - name: d
                        mountPath: /data
