# Which model server to run. Each engine's image, command and health path are in templates/_engines.tpl.
#   llamacpp — llama.cpp's llama-server: a GGUF model, on CPU or GPU
#   sglang   — SGLang: a Hugging Face model, on NVIDIA GPUs
engine: llamacpp

model:
  # llamacpp: a GGUF file in a Hugging Face repository.
  hfRepo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  hfFile: qwen2.5-0.5b-instruct-q4_k_m.gguf
  # sglang: a Hugging Face model ID.
  id: Qwen/Qwen2.5-1.5B-Instruct
  # The name clients use in /v1/chat/completions and see in /v1/models. Empty: derived from the model.
  servedName: ""
  # Maximum context length in tokens (llamacpp -c, sglang --context-length). 0: the model's own.
  contextLength: 4096

# A Secret with an HF_TOKEN key, for gated or private models. Empty: anonymous downloads.
hfTokenSecret: ""

# GPUs per replica (nvidia.com/gpu). llamacpp runs on CPU with 0; sglang needs at least 1.
gpu:
  count: 0
  resourceName: nvidia.com/gpu

# llama.cpp reads the node's cores, not the container's CPU limit, and thrashes without this.
# 0: the CPU request, rounded up.
threads: 0

resources:
  requests:
    cpu: "2"
    memory: 4Gi
  limits:
    cpu: "4"
    memory: 8Gi

# Where downloaded models are kept, so a restart does not download again.
cache:
  enabled: true
  size: 20Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 8000

# Arguments added to the engine's command line.
extraArgs: []
# Image override; empty uses the engine's default (templates/_engines.tpl).
image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicas: 1
nodeSelector: {}
tolerations: []
affinity: {}
podLabels: {}
podAnnotations: {}
