questions:
  - variable: model.hfRepo
    label: GGUF repository
    description: "Hugging Face repository holding the GGUF file."
    type: string
    default: Qwen/Qwen2.5-0.5B-Instruct-GGUF
    group: Model
  - variable: model.hfFile
    label: GGUF file
    type: string
    default: qwen2.5-0.5b-instruct-q4_k_m.gguf
    group: Model
  - variable: model.servedName
    label: Served model name
    description: "Name clients use in /v1/chat/completions. Empty: the file name."
    type: string
    default: ""
    group: Model
  - variable: model.contextLength
    label: Context length
    type: int
    default: 4096
    group: Model
  - variable: hfTokenSecret
    label: Hugging Face token Secret
    description: "Secret with an HF_TOKEN key, for gated or private models."
    type: string
    default: ""
    group: Model
  - variable: gpu.count
    label: GPUs
    description: "0 runs on CPU; 1 or more offloads the model to NVIDIA GPUs."
    type: int
    default: 0
    group: Resources
  - variable: resources.requests.cpu
    label: CPU request
    type: string
    default: "2"
    group: Resources
  - variable: resources.requests.memory
    label: Memory request
    type: string
    default: 4Gi
    group: Resources
  - variable: cache.size
    label: Model cache size
    type: string
    default: 20Gi
    group: Resources
